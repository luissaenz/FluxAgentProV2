[project]
name = "fluxagentpro-v2"
version = "0.1.0"
description = "AI Agent Orchestration Engine — Phase 1: Foundation"
readme = "README.md"
requires-python = ">=3.12,<3.14"

dependencies = [
    # API
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    # Database
    "supabase>=2.10.0",
    # LLM
    "anthropic>=0.40.0",
    "openai>=1.58.0",
    # Auth (Phase 5)
    "PyJWT>=2.0.0",
    # Utilities
    "python-dotenv>=1.0.0",
    "httpx>=0.28.0",
    "structlog>=24.4.0",
    # Phase 6 — Scheduler and date utilities
    "apscheduler>=3.10.0",
    "python-dateutil>=2.9.0",
    # MCP Server (Phase 5)
    "mcp>=1.0.0,<2.0.0",
    "sse-starlette>=0.21.0",
    "RestrictedPython>=7.0",
    "typer>=0.12.0",
]

[project.scripts]
fap = "src.cli.main:app"

[project.optional-dependencies]
crew = [
    "crewai>=0.100.0",
    "crewai-tools>=0.20.0",
]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-mock>=3.14.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.8.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501", "B008", "E402", "B904", "B017"]
fixable = ["ALL"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.uv]
required-environments = [
    "sys_platform == 'win32' and platform_machine == 'AMD64'",
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
]
